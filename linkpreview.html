<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrispBa Platform</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <meta property="og:title" content="CrispBa Official App" />
    <meta property="og:description" content="Tap to download the latest version securely." />
    
    <meta property="og:image" content="https://crispba.github.io/crispinjr-official-websites/linkpreviewimages.png" />
    
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://crispba.github.io/crispinjr-official-websites/linkpreviewimages.png">

    <style>
        :root {
            --accent: #38bdf8;
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* GLASSMORPHISM CONTAINER */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: 32px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .fade-in {
            opacity: 0;
            animation: fadeInItem 0.8s ease forwards;
        }

        @keyframes fadeInItem {
            to { opacity: 1; transform: translateY(0); }
        }

        .app-img { animation-delay: 0.3s; transform: translateY(10px); }
        .app-title { animation-delay: 0.5s; transform: translateY(10px); }
        .app-status { animation-delay: 0.7s; transform: translateY(10px); }
        .btn-box { animation-delay: 0.9s; transform: translateY(10px); }

        .app-img {
            width: 110px;
            height: 110px;
            border-radius: 28px;
            margin-bottom: 24px;
            object-fit: cover;
            border: 1px solid var(--border);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .app-status {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.4; }
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-download:hover {
            transform: scale(1.03);
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: var(--accent);
            filter: blur(120px);
            opacity: 0.15;
            z-index: -1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="glass-card">
        <img src="favicon(BQ).png" alt="App Icon" class="app-img fade-in">
        
        <h1 class="app-title fade-in">CrispBa</h1>
        
        <div class="app-status fade-in">
            <div class="pulse-dot"></div>
            Searching for latest APK...
        </div>

        <div class="btn-box fade-in">
            <a href="https://crispba.github.io/crispinjr-official-websites/CrispBa.apk" class="btn-download">Download Manually</a>
            <p style="font-size: 11px; color: #475569; margin-top: 15px;">
                Download will start in <span id="timer">3</span>s
            </p>
        </div>
    </div>

    <script>
        let timeLeft = 3;
        const timerElement = document.getElementById('timer');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = "https://crispba.github.io/crispinjr-official-websites/CrispBa.apk";
            }
        }, 1000);
    </script>
</body>
</html>
