<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Responsive Chat</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for chat bubbles and overall look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .chat-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .message-area {
            flex-grow: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 1rem;
            max-height: calc(100vh - 150px); /* Height adjustment for mobile */
        }

        /* Styling for markdown content */
        .ai-message pre {
            background-color: #1f2937;
            padding: 0.75rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            color: #d1d5db;
        }
        .ai-message code {
            color: #fcd34d;
            font-weight: 600;
        }
        .ai-message strong {
            font-weight: 700;
        }
        .ai-message ul, .ai-message ol {
            margin-left: 1.5rem;
            list-style-position: outside;
        }
        .ai-message ul {
            list-style-type: disc;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">

    <div class="chat-container">
        <div class="w-full max-w-4xl bg-white dark:bg-gray-800 shadow-2xl rounded-xl flex flex-col h-[95vh] md:h-[90vh]">
            
            <!-- Header -->
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 rounded-t-xl bg-indigo-600 dark:bg-indigo-700">
                <h1 class="text-xl font-bold text-white text-center">Gemini AI Assistant</h1>
                <p class="text-sm text-indigo-200 text-center">Ask me anything!</p>
            </div>

            <!-- Message Area -->
            <div id="message-area" class="message-area w-full">
                <!-- Initial Welcome Message -->
                <div class="flex justify-start mb-4">
                    <div class="ai-message p-3 rounded-xl rounded-tl-none bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 max-w-xs sm:max-w-md shadow-md">
                        Hello! I am Gemini, a large language model. I'm here to answer your questions.
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 sticky bottom-0 bg-white dark:bg-gray-800 rounded-b-xl">
                <div class="flex space-x-3">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="Type your message..." 
                        class="flex-grow p-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:text-white transition duration-200"
                        onkeydown="if(event.key === 'Enter') sendMessage()"
                        autocomplete="off"
                    >
                    <button 
                        id="send-button" 
                        onclick="sendMessage()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 disabled:opacity-50 flex items-center justify-center shadow-lg"
                    >
                        Send
                    </button>
                </div>
                <div id="loading-indicator" class="text-sm text-indigo-600 dark:text-indigo-400 mt-2 hidden">
                    Thinking...
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- Core Application Variables ---
        const messageArea = document.getElementById('message-area');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const loadingIndicator = document.getElementById('loading-indicator');
        const chatHistory = []; // Stores conversation history for context
        const MAX_RETRIES = 3;
        
        // Note: The API key is kept empty as per Canvas requirements.
        const apiKey = ""; 
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // --- Utility Functions ---

        /** Scrolls the message area to the latest message. */
        function scrollToBottom() {
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        /** Simple Markdown to HTML converter (for basic formatting). */
        function markdownToHtml(markdown) {
            // Convert bold and italics
            let html = markdown
                .replace(/\*\*\*(.*?)\*\*\*/gs, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.*?)\*\*/gs, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/gs, '<em>$1</em>');

            // Convert code blocks
            html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                const language = lang || 'plaintext';
                return `<pre><code class="language-${language}">${code.trim()}</code></pre>`;
            });

            // Convert inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Convert lists (simple approach)
            html = html.replace(/(\n|^)\s*-\s+(.*)/g, '$1<li>$2</li>');
            html = html.replace(/(\n|^)\s*\d+\.\s+(.*)/g, '$1<li>$2</li>');
            html = html.replace(/(\n(<li>.*?<\/li>)+)/g, '<br><ul>$1</ul><br>');
            
            // Convert paragraphs and line breaks
            html = html.replace(/\n\n/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');
            html = `<p>${html}</p>`;


            return html;
        }


        /** Renders a new message to the chat interface. */
        function renderMessage(content, role) {
            const isUser = role === 'user';
            const htmlContent = isUser ? content : markdownToHtml(content);

            const messageHtml = `
                <div class="flex ${isUser ? 'justify-end' : 'justify-start'} mb-4">
                    <div class="${isUser ? 'bg-indigo-500 text-white rounded-tr-none' : 'ai-message bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-tl-none'} 
                        p-3 rounded-xl max-w-xs sm:max-w-md shadow-md break-words"
                    >
                        ${htmlContent}
                    </div>
                </div>
            `;
            messageArea.innerHTML += messageHtml;
            scrollToBottom();
        }

        /** Controls UI state during API call. */
        function setUIState(isLoading) {
            sendButton.disabled = isLoading;
            userInput.disabled = isLoading;
            loadingIndicator.classList.toggle('hidden', !isLoading);
            sendButton.textContent = isLoading ? 'Sending...' : 'Send';
        }

        // --- API Call Logic with Exponential Backoff ---

        /** Implements exponential backoff for retries. */
        async function fetchWithRetry(payload, retries = 0) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.status === 429 && retries < MAX_RETRIES) {
                    const delay = Math.pow(2, retries) * 1000 + (Math.random() * 1000); // 2s, 4s, 8s + jitter
                    console.log(`Rate limit exceeded. Retrying in ${Math.round(delay / 1000)}s...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(payload, retries + 1);
                }

                if (!response.ok) {
                    // Try to get response body for detailed error info
                    const status = response.status;
                    let errorBody = 'No response body available.';
                    try {
                        errorBody = await response.text();
                    } catch (e) {
                        // ignore
                    }
                    const detailedError = `HTTP Error ${status}. Details: ${errorBody.substring(0, 250)}`;
                    throw new Error(detailedError);
                }

                return await response.json();
            } catch (error) {
                if (retries < MAX_RETRIES) {
                    const delay = Math.pow(2, retries) * 1000 + (Math.random() * 1000);
                    console.error(`Fetch failed. Retrying in ${Math.round(delay / 1000)}s...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return fetchWithRetry(payload, retries + 1);
                }
                // If it's the final attempt, throw the most descriptive error available.
                throw new Error(`API call failed after ${retries} retries. Reason: ${error.message}`);
            }
        }

        /** Main function to send message and get AI response. */
        async function sendMessage() {
            const userMessage = userInput.value.trim();
            if (!userMessage) return;

            setUIState(true);
            userInput.value = '';

            // 1. Render user message
            renderMessage(userMessage, 'user');
            
            // 2. Add user message to history
            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });

            // 3. Construct API payload
            const payload = {
                contents: chatHistory,
            };

            let aiResponseText = "Sorry, I encountered a critical error. Check the console for more details.";

            try {
                const result = await fetchWithRetry(payload);
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    aiResponseText = candidate.content.parts[0].text;
                    
                    // 4. Update history with AI response
                    chatHistory.push({ 
                        role: "model", 
                        parts: [{ text: aiResponseText }] 
                    });
                } else if (result.error) {
                    aiResponseText = `API Error: ${result.error.message}`;
                }
            } catch (error) {
                console.error("Critical API Error:", error);
                // Display the specific error message captured by fetchWithRetry
                aiResponseText = `Error: ${error.message}`;
            } finally {
                // 5. Render AI response
                renderMessage(aiResponseText, 'model');
                setUIState(false);
                scrollToBottom();
                userInput.focus();
            }
        }
    </script>
</body>
</html>
