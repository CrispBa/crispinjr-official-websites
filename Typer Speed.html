<!DOCTYPE html>

<head>
<head>

    <title>CB | Typer Speed Test</title>
    <script src="https://pl29058120.profitablecpmratenetwork.com/71/ef/9e/71ef9ed3dd6a2395a2c97ab770465e5d.js"></script>

    <style>
        :root {
            --primary: #f093fb;
            --primary-dark: #f5576c;
            --bg-gradient: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            --glass: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text: #2d3436;
            --success: #00b894;
            --error: #d63031;
            /* UPDATED to use the comprehensive System UI Font Stack */
            --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* --- Background Animation (Kept for Modernity) --- */
        .bg-shapes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .shape {
            position: absolute;
            filter: blur(50px);
            z-index: -1;
            animation: float 20s infinite;
        }
        .shape:nth-child(1) { top: -10%; left: -10%; width: 500px; height: 500px; background: #a8edea; animation-delay: 0s; }
        .shape:nth-child(2) { bottom: -10%; right: -10%; width: 400px; height: 400px; background: #fed6e3; animation-delay: -5s; }
        .shape:nth-child(3) { top: 40%; left: 40%; width: 300px; height: 300px; background: #e2d1c3; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(30px, -50px); }
            66% { transform: translate(-20px, 20px); }
        }

        /* --- Main App Container --- */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 750px;
            padding: 2.5rem;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #2d3436;
            letter-spacing: -1px;
        }
        
        #dictionary-status {
            font-size: 0.8rem;
            margin-bottom: 10px;
            opacity: 0.7;
            min-height: 20px;
        }

        /* --- Game Board --- */
        .word-wrapper {
            position: relative;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem 0;
        }

        .word-display {
            font-size: 4rem;
            font-weight: 700;
            color: #2d3436;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
            transition: all 0.2s;
            line-height: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 1.5rem;
            font-size: 2rem;
            border: 2px solid transparent;
            border-radius: 16px;
            background: rgba(255,255,255,0.8);
            color: #333;
            text-align: center;
            margin-bottom: 2rem;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            font-weight: 600;
            letter-spacing: 1px;
        }

        input.valid { border-color: var(--success); color: var(--success); }
        input.invalid { border-color: var(--error); background: #fff0f0; color: var(--error); }

        /* --- Progress Bar --- */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            transition: width 1s linear;
        }

        /* --- Dashboard --- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.5rem;
        }

        .stat-card {
            background: rgba(255,255,255,0.4);
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .stat-card h3 { 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            opacity: 0.7; 
            margin-bottom: 0.25rem; 
        }
        
        .stat-card span { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #2d3436;
        }

        #wpm-display { color: var(--primary-dark); }

        /* --- Overlays / Modals --- */
        .overlay {

    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgb(255 255 255 / 77%);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.3s;
        }

        .overlay.hidden { opacity: 0; pointer-events: none; }

        .settings-bar {
            margin: 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            cursor: pointer;
        }

        .btn {
            padding: 1rem 3.5rem;
            font-size: 1.2rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border: none;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.6);
        }

        .result-title { font-size: 1.5rem; color: #636e72; }
        .final-wpm { font-size: 5rem; font-weight: 900; color: var(--primary-dark); line-height: 1; margin: 10px 0; }
        .result-details { font-size: 1.1rem; color: #636e72; margin-bottom: 30px; }
        
        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-anim { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape"></div><div class="shape"></div><div class="shape"></div>
    </div>

    <div class="app-container">
        
        <div id="start-overlay" class="overlay">
            <h1>Type Master</h1>
            <p>Progressive Speed Test</p>
            
            <div id="dictionary-status">Loading dictionary...</div>

            <div class="settings-bar">
                <label>Duration:</label>
                <select id="duration-select">
                    <option value="15">Sprint (15s)</option>
                    <option value="30" selected>Standard (30s)</option>
                    <option value="60">Marathon (60s)</option>
                </select>
            </div>

            <button class="btn" onclick="game.start()">Start Test</button>
        </div>

        <div id="end-overlay" class="overlay hidden">
            <div class="result-title">Your Speed</div>
            <div class="final-wpm" id="final-wpm">0</div>
            <p class="result-details">Words Per Minute</p>
            
            <div style="display: flex; gap: 20px; margin-bottom: 30px; opacity: 0.8;">
                <div>Accuracy: <strong id="final-accuracy">100%</strong></div>
                <div>Words: <strong id="final-words">0</strong></div>
            </div>

            <button class="btn" onclick="game.reset()">Try Again</button>
        </div>

        <header>
            <div class="progress-container">
                <div class="progress-bar" id="time-bar"></div>
            </header>

        <div class="game-board">
            <div class="word-wrapper">
                <div class="word-display pop-anim" id="word-display">READY</div>
            </div>
            
            <input type="text" id="word-input" placeholder="Type..." autocomplete="off" disabled>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Time Left</h3>
                    <span id="time-left">30s</span>
                </div>
                <div class="stat-card" style="border-color: var(--primary);">
                    <h3>WPM</h3>
                    <span id="wpm-display">0</span>
                </div>
                <div class="stat-card">
                    <h3>Words</h3>
                    <span id="word-count">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * Audio System (unchanged)
         */
        class AudioController {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type, duration, vol = 0.1) {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playType() { this.playTone(800, 'sine', 0.05, 0.05); }
            playSuccess() { 
                this.playTone(600, 'triangle', 0.1, 0.05); 
                setTimeout(() => this.playTone(900, 'triangle', 0.2, 0.05), 50);
            }
            playFinish() {
                this.playTone(400, 'sine', 0.5);
                setTimeout(() => this.playTone(600, 'sine', 0.5), 200);
            }
        }

        /**
         * Game Engine
         */
        class TypeMaster {
            ONLINE_WORD_LIST_URL = 'https://raw.githubusercontent.com/dwyl/english-words/master/words.json';

            constructor() {
                // FALLBACK WORDS (Large list for offline mode)
                this.words = [/* ... existing large list for fallback ... */];
                
                // Keep the previous large list here (omitted for brevity, copy from previous solution)
                this.words = [
                    'account','action','amount','animal','answer','appeal','artist','aspect','attack','author','bureau','button','camera','cancer','career','carpet','castle','center','choice','church','circle','client','clouds','column','comedy','common','corner','cotton','county','couple','course','cousin','credit','custom','damage','danger','debate','degree','design','desire','device','dinner','doctor','dollar','domain','driver','editor','effect','effort','empire','energy','engine','estate','ethics','expert','fabric','factor','family','farmer','father','figure','finger','finish','flavor','flight','flower','forest','format','former','friend','future','garden','gender','german','ground','growth','guilty','handle','harbor','hazard','health','heaven','height','horror','income','injury','insect','inside','island','jacket','jersey','judge','junior','killer','ladder','lawyer','leader','league','leaves','legacy','legend','length','lesson','letter','lights','liquor','listen','lively','living','lounge','luxury','makeup','manage','manual','margin','market','master','matrix','matter','medium','member','memory','mental','mentor','method','metric','middle','minute','mirror','mobile','moment','monkey','mother','motion','motors','muscle','museum','native','nature','nausea','needle','nerves','nobody','normal','notice','novels','number','object','office','offset','online','option','orange','orders','origin','outlet','output','packet','palace','parent','parish','patent','people','period','person','phases','phones','phrase','physics','piano','picnic','picture','planet','plants','player','please','plenty','pocket','poetry','police','policy','polish','poster','potato','powder','power','prayer','pretty','prince','prison','profit','prompt','proper','public','purple','puzzle','python','quartz','rabbit','racing','radius','random','rating','reader','reality','reason','recipe','record','region','regret','relief','repair','repeat','report','rescue','resort','result','retail','review','reward','rhythm','ribbon','rocket','romance','routine','safety','salary','sample','saving','scales','scheme','school','screen','script','search','season','second','secret','sector','senior','series','server','shadow','shared','sheets','shells','shield','shirts','shorts','shower','signal','silver','simple','singer','single','sister','sketch','skinny','sleeve','slides','smells','smooth','soccer','social','socket','sodium','source','soviet','spaces','speaker','speech','speed','sphere','spirit','splash','spoiler','sports','spread','spring','square','stable','stadium','staff','stages','stairs','stamp','stance','stand','start','state','static','statue','status','steam','steel','stick','still','stock','stone','store','storm','story','stove','strap','straw','street','stress','strict','strike','string','strip','strong','studio','study','stuff','style','subject','submit','subway','sugar','summer','Summit','Sunday','supply','surely','surface','survey','switch','symbol','system','table','tablet','tackle','tailor','target','taste','taxes','teach','teams','tears','teeth','temper','temple','tennis','tenure','terms','terror','thanks','theft','theme','theory','things','thread','threat','throat','thumb','ticket','tiger','timber','timer','times','title','toast','token','tongue','tools','tooth','topic','total','touch','tough','tours','towel','tower','towns','track','trade','trail','train','trait','trash','treat','trend','trial','tribe','trick','truck','trust','truth','turns','tutor','types','units','unity','update','usage','users','valid','valley','value','valve','vault','vector','vegan','venue','verse','video','views','villa','vinyl','virus','visit','visual','voice','volume','voter','wagon','waist','waiter','walks','walls','wants','warning','waste','watch','water','waves','wealth','weapon','weary','weather','wedding','wedge','weekend','weekly','weight','weird','whale','wheat','wheel','wheels','where','while','white','whole','widow','width','wife','wild','will','wind','window','winds','wine','wing','wings','winner','winter','wires','wisdom','witch','wives','woman','women','wonder','woods','wool','words','work','worker','works','world','worms','worry','worse','worst','worth','wound','wrap','wrist','writer','writes','wrong','yard','year','years','yellow','yield','young','youth','zone'
                ];


                this.wordBuckets = {}; // { 'easy': [...], 'medium': [...], 'hard': [...] }
                this.currentWeight = [60, 30, 10]; // Initial probabilities: Easy(60%), Medium(30%), Hard(10%)
                
                this.state = {
                    isPlaying: false,
                    duration: 30,
                    timeLeft: 30,
                    score: 0, 
                    keystrokes: 0,
                    correctKeystrokes: 0,
                    currentWord: '',
                    errors: 0
                };

                this.audio = new AudioController();
                
                this.dom = {
                    wordDisplay: document.getElementById('word-display'),
                    input: document.getElementById('word-input'),
                    wpm: document.getElementById('wpm-display'),
                    timeLeft: document.getElementById('time-left'),
                    timeBar: document.getElementById('time-bar'),
                    wordCount: document.getElementById('word-count'),
                    startOverlay: document.getElementById('start-overlay'),
                    endOverlay: document.getElementById('end-overlay'),
                    finalWpm: document.getElementById('final-wpm'),
                    finalAccuracy: document.getElementById('final-accuracy'),
                    finalWords: document.getElementById('final-words'),
                    durationSelect: document.getElementById('duration-select'),
                    dictionaryStatus: document.getElementById('dictionary-status')
                };

                this.timerInterval = null;
                this.loadDictionary().then(() => this.init());
            }

            // --- Dictionary Loading & Processing ---

            async loadDictionary() {
                this.dom.dictionaryStatus.innerHTML = 'Loading dictionary...';
                try {
                    const response = await fetch(this.ONLINE_WORD_LIST_URL);
                    if (!response.ok) throw new Error('Network response was not ok');
                    
                    const data = await response.json();
                    let fetchedWords = [];
                    
                    if (Array.isArray(data)) {
                        fetchedWords = data.map(word => word.toLowerCase().trim()).filter(w => w.length > 2 && w.length < 20);
                    } else if (typeof data === 'object' && data !== null) {
                        fetchedWords = Object.keys(data).map(word => word.toLowerCase().trim()).filter(w => w.length > 2 && w.length < 20);
                    }

                    if (fetchedWords.length > this.words.length) {
                        this.words = fetchedWords;
                        this.dom.dictionaryStatus.innerHTML = `<span style="color: var(--success);">Online Dictionary (${this.words.length} words)</span>`;
                    } else {
                        throw new Error('Fetched list was too small, using local.');
                    }
                } catch (error) {
                    // Fallback to local words
                    console.error("Failed to fetch external dictionary:", error);
                    this.dom.dictionaryStatus.innerHTML = `<span style="color: var(--error);">Local Dictionary (${this.words.length} words)</span>`;
                }
                
                // Process the finalized word list into difficulty buckets
                this.processWordBuckets();
            }

            processWordBuckets() {
                this.wordBuckets = { easy: [], medium: [], hard: [] };
                
                this.words.forEach(word => {
                    if (word.length <= 5) {
                        this.wordBuckets.easy.push(word);
                    } else if (word.length <= 8) {
                        this.wordBuckets.medium.push(word);
                    } else {
                        this.wordBuckets.hard.push(word);
                    }
                });
                console.log("Word Buckets Ready:", { easy: this.wordBuckets.easy.length, medium: this.wordBuckets.medium.length, hard: this.wordBuckets.hard.length });
            }

            // --- Game Flow & Logic ---

            init() {
                this.dom.input.addEventListener('input', (e) => {
                    if (!this.state.isPlaying) return;
                    
                    const val = e.target.value.toLowerCase().trim();
                    const current = this.state.currentWord;
                    
                    this.audio.playType();

                    if (val === current) {
                        this.state.keystrokes += val.length + 1;
                        this.state.correctKeystrokes += val.length + 1;
                        this.success();
                    } else if (current.startsWith(val)) {
                        this.dom.input.className = 'valid';
                    } else {
                        this.dom.input.className = 'invalid';
                        if (e.inputType === "insertText") this.state.errors++;
                    }
                });
            }

            start() {
                // ... (State reset unchanged) ...
                this.state.duration = parseInt(this.dom.durationSelect.value);
                this.state.timeLeft = this.state.duration;
                this.state.score = 0;
                this.state.keystrokes = 0;
                this.state.correctKeystrokes = 0;
                this.state.errors = 0;
                this.state.isPlaying = true;
                
                // Reset difficulty to base
                this.currentWeight = [60, 30, 10]; 

                this.dom.startOverlay.classList.add('hidden');
                this.dom.endOverlay.classList.add('hidden');
                this.dom.input.disabled = false;
                this.dom.input.value = '';
                this.dom.input.focus();
                this.dom.wordCount.innerText = '0';
                this.dom.wpm.innerText = '0';
                
                if (this.audio.ctx.state === 'suspended') this.audio.ctx.resume();

                this.nextWord();
                this.startTimer();
            }

            // --- Progressive Difficulty Logic ---

            getNextWordBucket() {
                // Adjust weights every 10 words
                if (this.state.score > 0 && this.state.score % 10 === 0 && this.state.score <= 30) {
                    // Increase probability of harder words incrementally
                    // Initial: [60, 30, 10]
                    // Score 10: [50, 35, 15]
                    // Score 20: [40, 40, 20]
                    // Score 30: [30, 40, 30] (Max Challenge)
                    this.currentWeight[0] = Math.max(30, this.currentWeight[0] - 10); // Easy -10
                    this.currentWeight[1] += 5; // Medium +5
                    this.currentWeight[2] += 5; // Hard +5
                    console.log(`Difficulty increased. New weights: ${this.currentWeight}`);
                }

                const totalWeight = this.currentWeight[0] + this.currentWeight[1] + this.currentWeight[2];
                let rand = Math.random() * totalWeight;

                if (rand < this.currentWeight[0]) {
                    return 'easy';
                } else if (rand < this.currentWeight[0] + this.currentWeight[1]) {
                    return 'medium';
                } else {
                    return 'hard';
                }
            }

            nextWord() {
                const bucketKey = this.getNextWordBucket();
                const bucket = this.wordBuckets[bucketKey];
                
                if (bucket.length === 0) {
                    // Fallback if a bucket is empty (shouldn't happen with large lists)
                    return this.nextWord(); 
                }

                const randIndex = Math.floor(Math.random() * bucket.length);
                this.state.currentWord = bucket[randIndex];
                
                this.dom.wordDisplay.classList.remove('pop-anim');
                void this.dom.wordDisplay.offsetWidth; 
                this.dom.wordDisplay.classList.add('pop-anim');
                
                this.dom.wordDisplay.innerText = this.state.currentWord;
                this.dom.input.value = '';
                this.dom.input.className = '';
            }

            success() {
                this.state.score++;
                this.audio.playSuccess();
                this.dom.wordCount.innerText = this.state.score;
                this.updateWPM();
                this.nextWord();
            }

            // --- Timer & WPM (Unchanged) ---
            
            startTimer() {
                clearInterval(this.timerInterval);
                const startTime = Date.now();
                const totalTime = this.state.duration * 1000;

                this.timerInterval = setInterval(() => {
                    if (!this.state.isPlaying) return;

                    const elapsed = Date.now() - startTime;
                    const remaining = totalTime - elapsed;
                    this.state.timeLeft = Math.max(0, Math.ceil(remaining / 1000));

                    this.dom.timeLeft.innerText = this.state.timeLeft + 's';
                    const percentage = (remaining / totalTime) * 100;
                    this.dom.timeBar.style.width = `${percentage}%`;

                    if (elapsed > 1000) this.updateWPM(elapsed);

                    if (remaining <= 0) {
                        this.gameOver();
                    }
                }, 100);
            }

            updateWPM(elapsedMs) {
                if(!elapsedMs) {
                    elapsedMs = (this.state.duration - this.state.timeLeft) * 1000;
                }
                
                if (elapsedMs < 1000) return; 

                const minutes = elapsedMs / 60000;
                const wpm = Math.round((this.state.correctKeystrokes / 5) / minutes);
                
                this.dom.wpm.innerText = wpm;
                return wpm;
            }

            gameOver() {
                this.state.isPlaying = false;
                clearInterval(this.timerInterval);
                this.audio.playFinish();
                
                this.dom.input.disabled = true;
                this.dom.endOverlay.classList.remove('hidden');

                const minutes = this.state.duration / 60;
                const finalWPM = Math.round((this.state.correctKeystrokes / 5) / minutes);
                
                const totalTyped = this.state.correctKeystrokes + this.state.errors;
                const accuracy = totalTyped === 0 ? 0 : Math.round((this.state.correctKeystrokes / totalTyped) * 100);

                this.dom.finalWpm.innerText = finalWPM;
                this.dom.finalWords.innerText = this.state.score;
                this.dom.finalAccuracy.innerText = accuracy + '%';
            }
            
            reset() {
                this.dom.startOverlay.classList.remove('hidden');
                this.dom.endOverlay.classList.add('hidden');
                this.dom.wordDisplay.innerText = "READY";
                this.dom.input.value = "";
                this.dom.input.disabled = true;
                this.dom.timeBar.style.width = '100%';
            }
        }

        const game = new TypeMaster();
    </script>
</body>
</html>
