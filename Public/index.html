<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web2APK | Bible Quest Edition</title>
    <style>
        :root { --neon: #00f2ff; --bg: #0d1117; --card: #161b22; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: var(--card); padding: 2rem; border-radius: 20px; border: 1px solid #30363d; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 span { color: var(--neon); }
        .form-group { text-align: left; margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #8b949e; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--neon); }
        .build-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; background: linear-gradient(45deg, #00d4ff, #0055ff); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .build-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status-area { margin-top: 1.5rem; display: none; }
        .progress-bar { height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
        .progress-fill { height: 100%; width: 0%; background: var(--neon); transition: 0.5s; }
        .log { font-size: 0.8rem; color: #8b949e; }
    </style>
</head>
<body>

<div class="container">
    <h1>Web2<span>APK</span></h1>
    <p>Build your Bible Quest APK</p>

    <div class="form-group">
        <label>App Name</label>
        <input type="text" id="appName" value="Bible Quest">
    </div>

    <div class="form-group">
        <label>Website URL (Must be HTTPS)</label>
        <input type="url" id="appUrl" placeholder="https://crispba.github.io/...">
    </div>

    <button class="build-btn" id="startBuild">GENERATE APK</button>

    <div id="status-area">
        <div class="progress-bar"><div class="fill-container"><div class="progress-fill" id="fill"></div></div></div>
        <p class="log" id="status-text">Ready to build...</p>
    </div>
</div>

<script>
    const buildBtn = document.getElementById('startBuild');
    const statusArea = document.getElementById('status-area');
    const fill = document.getElementById('fill');
    const statusText = document.getElementById('status-text');

    buildBtn.addEventListener('click', async () => {
        const name = document.getElementById('appName').value;
        const url = document.getElementById('appUrl').value;

        if (!name || !url) return alert("Please fill in all fields");
        if (!url.startsWith('https://')) return alert("URL must start with https:// for Android security.");

        statusArea.style.display = 'block';
        buildBtn.disabled = true;
        updateProgress("Connecting to Render Cloud...", 20);

        try {
            // UPDATED TO YOUR LIVE RENDER URL
            const response = await fetch('https://crispinjr-official-websites.onrender.com/api/build', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, url: url })
            });

            if (!response.ok) throw new Error("Server error. Try again in 30s.");

            updateProgress("Compiling Android Assets...", 70);
            const data = await response.json();

            if (data.success) {
                updateProgress("Success! Starting Download...", 100);
                window.location.href = data.downloadUrl;
            }
        } catch (err) {
            statusText.innerText = "Error: " + err.message;
            statusText.style.color = "#ff4444";
        } finally {
            buildBtn.disabled = false;
        }
    });

    function updateProgress(msg, percent) {
        statusText.innerText = msg;
        fill.style.width = percent + "%";
    }
</script>
</body>
</html>
