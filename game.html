

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Playa</title>
    <link rel="icon" type="image/x-icon" href="playa.ico?v=2">
	<link rel="icon" type="image/png" sizes="32x32" href="playa.ico">
	<link rel="apple-touch-icon" href="playa.ico">
    <meta property="og:title" content="Playa | Play + Earn " />
    <meta property="og:description" content="Explore the official hub of CrispBa. Featuring web development projects, creative content, and a suite of integrated digital services." />
    <meta property="og:image" content="https://crispba.github.io/crispinjr-official-websites/linkimages(P).png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#a0a1a">
    <link rel="stylesheet" href="game.css">
<base target="_blank">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <div class="avatar">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar">
            </div>
<div class="balance-container">
    <img src="cash.png" alt="cash" class="balance-overlap-icon">
    
    <div class="balance-box">
        <img src="money-icon.png" alt="money" class="balance-inner-money">
        <span class="balance-text">34.60</span>
    </div>


                <div class="balance-box secondary">
<img src="coins.png" alt="money" class="balance-inner-coins">
    <span class="balance-text">13K</span>
    <!-- ADD THIS IMAGE for the right-side bag icon -->
    <img src="cash.png" alt="bag" class="balance-overlap-icon-right">
</div>
            </div>
            <div class="header-icons">
                <button class="header-icon" id="mute-btn" onclick="toggleMute()">
    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
        
        <line id="mute-slash" x1="3" y1="21" x2="21" y2="3" style="display: none;"></line>
    </svg>
</button>
                <button class="header-icon notification-wrapper" onclick="showModal('Notifications', '3 new notifications!')">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 8C18 6.4087 17.3679 4.88258 16.2426 3.75736C15.1174 2.63214 13.5913 2 12 2C10.4087 2 8.88258 2.63214 7.75736 3.75736C6.63214 4.88258 6 6.4087 6 8C6 15 3 17 3 17H21C21 17 18 15 18 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M13.73 21C13.5542 21.3031 13.3019 21.5547 12.9982 21.7295C12.6946 21.9044 12.3504 21.9965 12 21.9965C11.6496 21.9965 11.3054 21.9044 11.0018 21.7295C10.6982 21.5547 10.4458 21.3031 10.27 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="notification-dot"></span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="earn-view">
                <div class="earn-header">
                </div>
                <div class="offers-list" id="offersList">
                    <!-- Game cards will be inserted here by JavaScript -->
                </div>
            </div>
        </main>

        <!-- FIXED FLOATING FEATURES - Only 3 buttons -->
        <div class="fixed-floating-features active" id="floatingFeatures">
            <div class="floating-features-container">
                <!-- Bonus Button (Left) -->
             <div class="float-btn bonus" onclick="showBonusModal()">
    <div class="float-bonus-wrapper">
        <img src="invite.png" alt="Bonus Icon" class="float-bonus-icon">
    </div>
    <span class="float-bonus-label">
        <p style="font-size: 10px; display: flex; align-items: center; margin: 0;">
            <img src="money.png" alt="cash" style="height: 1em; margin-right: 4px; vertical-align: middle;">
            ₱50
        </p>
    </span>
</div>
<div class="float-btn theme theme-image-btn" onclick="showThemeModal()">
    <img src="theme.png" alt="Theme" class="float-theme-image">
</div>


                <div class="float-btn skin shop-btn" onclick="showSkinModal()">
    <img src="skin_shop.png" alt="Shop" class="float-shop-image">
</div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('earn')">
                <div class="nav-icon-wrapper">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 7H5C3.89543 7 3 7.89543 3 9V18C3 19.1046 3.89543 20 5 20H19C20.1046 20 21 19.1046 21 18V9C21 7.89543 20.1046 7 19 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 11H16.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 11V7C3 5.89543 3.89543 5 5 5H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <span class="nav-label">Earn</span>
            </button>
            <button class="nav-item" onclick="switchTab('offers')">
                <div class="nav-icon-wrapper">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="10" width="2" height="2" fill="currentColor"/>
                        <rect x="8" y="8" width="2" height="2" fill="currentColor"/>
                        <rect x="10" y="10" width="2" height="2" fill="currentColor"/>
                        <rect x="8" y="12" width="2" height="2" fill="currentColor"/>
                        <rect x="17" y="10" width="2" height="2" fill="currentColor"/>
                        <rect x="19" y="8" width="2" height="2" fill="currentColor"/>
                        <rect x="21" y="10" width="2" height="2" fill="currentColor"/>
                        <rect x="19" y="12" width="2" height="2" fill="currentColor"/>
                        <path d="M2 8C2 6.89543 2.89543 6 4 6H20C21.1046 6 22 6.89543 22 8V16C22 17.1046 21.1046 18 20 18H4C2.89543 18 2 17.1046 2 16V8Z" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <span class="nav-label">My Offers</span>
            </button>
            <button class="nav-item" onclick="switchTab('cashout')">
                <div class="nav-icon-wrapper">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                        <path d="M12 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M9 10H12C13.6569 10 15 11.3431 15 13C15 14.6569 13.6569 16 12 16H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="nav-label">Cashout</span>
            </button>
            <button class="nav-item" onclick="switchTab('rewards')">
                <div class="nav-icon-wrapper">
                    <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 21H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M12 17V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M7 4H17V8C17 11.3137 14.7614 14 12 14C9.23858 14 7 11.3137 7 8V4Z" stroke="currentColor" stroke-width="2"/>
                        <path d="M7 6H5C4.44772 6 4 6.44772 4 7V8C4 9.65685 5.34315 11 7 11" stroke="currentColor" stroke-width="2"/>
                        <path d="M17 6H19C19.5523 6 20 6.44772 20 7V8C20 9.65685 18.6569 11 17 11" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </div>
                <span class="nav-label">Rewards</span>
            </button>
        </nav>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalTitle">Title</div>
            <div class="modal-text" id="modalText">Message</div>
            <button class="btn-close" onclick="closeModal(event)">Close</button>
        </div>
    </div>

	<script src="game.js"></script>
</body>
</html>
