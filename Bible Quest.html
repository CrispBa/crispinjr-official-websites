        :root {
            --gold: #FFD700;

        .password-wrapper {
    position: relative;
    width: 100%;
}

/* Hide the eye icon by default */
.password-wrapper i, .password-wrapper .lucide {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: var(--gold);
    width: 20px !important;
    height: 20px !important;
    opacity: 0.8;
    display: none; /* Hidden */
    z-index: 10;
}

/* Show the icon ONLY when the user starts typing 
   (i.e., when the placeholder is NOT shown) */
.password-wrapper input:not(:placeholder-shown) + i,
.password-wrapper input:not(:placeholder-shown) + .lucide {
    display: block;
}

.password-wrapper input {
    padding-right: 45px !important;
}
#toast { 
    position: fixed; 
    bottom: 100px; 
    left: 50%; 
    transform: translateX(-50%) translateY(150px); 
    background: var(--gold); 
    color: #000; 
    padding: 12px 25px; 
    border-radius: 50px; 
    font-weight: 800; 
    font-size: 0.85rem;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    /* This must be higher than the authOverlay z-index */
    z-index: 100001 !important; 
    white-space: nowrap;
    pointer-events: none;
}
        #toast.show { transform: translateX(-50%) translateY(0); }

        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           AUTH OVERLAY ANIMATIONS & STYLING
           ============================================ */
        @keyframes fadeInBackdrop {
            from { backdrop-filter: blur(0px); background: rgba(0,0,0,0); }
            to { backdrop-filter: blur(10px); background: rgba(0,0,0,0.95); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes floatIn {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes shimmer {
            0%, 100% { background-position: -1000px 0; }
            50% { background-position: 1000px 0; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.2), 0 8px 32px rgba(255, 215, 0, 0.1); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.4), 0 8px 32px rgba(255, 215, 0, 0.2); }
        }

        #authOverlay::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(100, 150, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        #authOverlay > div::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: unset;
        }

        #authOverlay > div > * {
            position: relative;
            z-index: 1;
        }

        #loginBox, #registerBox {
            animation: fadeInUp 0.6s ease 0.2s backwards;
        }

        /* Login/Register Form Inputs */
    
        #authOverlay input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        #authOverlay input:valid {
            /* border-color: #4CAF50; */

        /* Primary Buttons (BEGIN QUEST, ENTER THE QUEST) */
        #authOverlay button[onclick*="handleAuth"] {
            background: var(--gold-gradient);
            color: #3a2a00;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.3);
        }

        #authOverlay button[onclick*="handleAuth"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        #authOverlay button[onclick*="handleAuth"]:active {
            transform: translateY(-1px);
        }

        /* Secondary Buttons */
        #authOverlay button[onclick*="toggleAuthMode"] {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            transition: all 0.3s ease;
        }

        #authOverlay button[onclick*="toggleAuthMode"]:hover {
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transform: translateY(-2px);
        }

        /* Guest Button */
        #authOverlay button[onclick*="continueAsGuest"] {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
        }

        #authOverlay button[onclick*="continueAsGuest"]:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        /* File Input Styling */
        #authOverlay input[type="file"] {
            padding: 12px;
            cursor: pointer;
            border: 2px dashed rgba(255, 215, 0, 0.3);
            transition: all 0.3s ease;

/* Login Overlay Styling from Example */
#authOverlay {
    
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
    box-sizing: border-box;
    z-index: 99999;
    touch-action: none;
    overflow: hidden;
    background-image: linear-gradient(rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.85)), url(https://images.unsplash.com/photo-1438109491414-7198515b166b?q=80&w=2070&auto=format&fit=crop);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

#authOverlay > div {
    position: relative;
    z-index: 100000 !important;
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 340px;

#authOverlay h2 {
    color: var(--gold);
    font-family: 'Cinzel', serif;
    margin-bottom: 20px;
    font-size: 1.5rem;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}

#authOverlay input {
width: 100%;
    padding: 11px;
    margin: 8px 0;
    border-radius: 12px;
    border: 2px solid #c9c5b224;
    background: rgba(0, 0, 0, 0.4);
    color: white;
    outline: none;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
}

#authOverlay input:focus {
    background: rgba(0, 0, 0, 0.6);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    border-color: #FFE55C;
}

#authOverlay button {
    width: 100%;
    padding: 11px;
    margin-top: 10px;
    border-radius: 12px;
    border: none;
    font-weight: 900;
    cursor: pointer;
    background: var(--gold-gradient);
    color: #3a2a00;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

#authOverlay button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
}

@keyframes floatIn {
    from { opacity: 0; transform: translateY(50px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeInBackdrop {
    from { backdrop-filter: blur(0px); background: rgba(0,0,0,0); }
    to { backdrop-filter: blur(10px); background: rgba(0,0,0,0.95); }
}
        #authOverlay input[type="file"]:hover {
            border-color: rgba(255, 215, 0, 0.6);
            background: rgba(255, 215, 0, 0.05);
        }

        /* Typography in Auth */
      
        #authOverlay p {
            color: #ccc;
            font-size: 0.85rem;
            margin-bottom: 15px;
            animation: fadeInUp 0.6s ease 0.1s backwards;
        }

        @keyframes inputFocus {
            0% { box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1); }
            100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
        }

        #authOverlay input:focus {
            animation: inputFocus 0.3s ease forwards;
        }

        /* Success State for Inputs */
        @keyframes successPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(76, 175, 80, 0.3); }
            50% { box-shadow: 0 0 25px rgba(76, 175, 80, 0.5); }
        }

        #authOverlay input[type="email"]:valid,
        #authOverlay input[type="password"]:valid {
            animation: successPulse 2s ease infinite;
        }

        /* Button Ripple Effect */
        @keyframes ripple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        #authOverlay button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #authOverlay button:active::after {
            animation: ripple 0.6s ease-out;
        }

        /* Form Progress Indicator */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #authOverlay input[type="text"],
        #authOverlay input[type="email"],
        #authOverlay input[type="password"],
        #authOverlay input[type="file"] {
            animation: slideInRight 0.5s ease backwards;
        }

        #authOverlay input[type="text"] { animation-delay: 0.1s; }
        #authOverlay input[type="email"] { animation-delay: 0.2s; }
        #authOverlay input[type="password"] { animation-delay: 0.3s; }
        #authOverlay input[type="file"] { animation-delay: 0.15s; }

        /* Mobile Responsive Design */
        @media (max-width: 480px) {

            #authOverlay > div {
                width: 95%;
                max-width: 98vw;
                height: auto;
                min-height: 60vw;
                padding: 18px 8px;
                /* color: #ffd700b8; */
            }

            #authOverlay h2 {
                font-size: 1.3rem;
                margin-bottom: 8px;
                /* color: #ffffff94; */
            }

            #authOverlay p {
                font-size: 0.8rem;
                margin-bottom: 12px;
            }

            #authOverlay input {
                padding: 10px;
                margin: 6px 0;
                font-size: 16px;
                border-radius: 10px;
            }

            #authOverlay button {
                padding: 10px;
                margin-top: 8px;
                font-size: 0.9rem;
                border-radius: 10px;
            }
        }
    </style>
</head>

<div id="authOverlay">

<h2 style="color: #ffd700b8; font-family:'Cinzel'; margin-bottom:20px;">Bible Quest Login</h2>
        <input type="email" id="authEmail" placeholder="Email Address">
        <div class="password-wrapper">
    <input type="password" id="authPass" placeholder="Password">
    <i data-lucide="eye" onclick="togglePassword('authPass', this)"></i>
</div>
        <button class="btn-submit" onclick="handleAuth('login')">Login</button>

        </p>
    </div>

    <div class="modal-box" id="registerBox" style="display:none;">
        <h2 style="color:#ffffff94; font-family:'Cinzel'; margin-bottom:20px;">Join the Quest</h2>
               

    <input type="text" id="regName" placeholder="Full Name">
    <input type="email" id="regEmail" placeholder="Email Address">
    
    <div class="password-wrapper">
        <input type="password" id="regPass" placeholder="Create Password">
        <i data-lucide="eye" onclick="togglePassword('regPass', this)"></i>
    </div>
    
    <button class="btn-submit" onclick="handleAuth('register')">CREATE ACCOUNT</button>
    <p style="margin-top:15px; font-size:0.8rem; opacity:0.7;">
        Already a seeker? <span onclick="toggleAuthMode()" style="color:var(--gold); cursor:pointer; font-weight:800; text-decoration: underline;">Login here</span>
    </p>
</div>
    <script>
 function togglePassword(inputId, iconEl) {
    const input = document.getElementById(inputId);
    
    // If the input is currently hidden (password), show it (text)
    if (input.type === "password") {
        input.type = "text";
        iconEl.setAttribute('data-lucide', 'eye'); // Change icon to 'closed eye'
    } else {

        async function loadVerse(ref) {
            const vRefElem = document.getElementById('vRef');
            const vTextElem = document.getElementById('vText');
            const btn = document.getElementById('claimBtn');
            vTextElem.innerText = "Consulting the scriptures...";
            btn.disabled = true;

            try {
                const publicRes = await fetch(`https://bible-api.com/${encodeURIComponent(ref)}`);
                const publicData = await publicRes.json();
                
                let verseText = "";
                if(publicData.text) {
                    vRefElem.innerText = publicData.reference;
                    verseText = publicData.text.trim();
                } else {
                    showToast("Verse not found.");
                    return;
                }

                vTextElem.innerText = `"${verseText}"`;
                
                // ADD THIS LINE: Counts words by splitting by spaces and filtering out empties
                currentChars = verseText.split(/\s+/).filter(word => word.length > 0).length;

                document.getElementById('verseImg').src = `https://picsum.photos/seed/${Math.random()}/600/400`;
                startTimer();
            } catch(error) {
                const fallback = POOL[Math.floor(Math.random() * POOL.length)];
                vRefElem.innerText = fallback + " (Offline)";
                vTextElem.innerText = "The Lord is my shepherd; I shall not want.";
                // REPLACE THIS: Fallback count for the sentence above (9 words)
                currentChars = 9; 
                startTimer();
            }
        }

        function startTimer() {
            let tLeft = 60;
            const circle = document.getElementById('pCircle');
            const btn = document.getElementById('claimBtn');
            const txt = document.getElementById('timerTxt');
            btn.disabled = true; btn.innerText = "Meditating...";
            if(tInt) clearInterval(tInt);
            tInt = setInterval(() => {
                tLeft--; txt.innerText = tLeft + "s";
                circle.style.strokeDashoffset = 283 - ((60 - tLeft) / 60 * 283);
                if(tLeft <= 0) { 
                    clearInterval(tInt);
                    txt.innerText = "AMEN";
                    btn.disabled = false;
                    btn.innerText = `Claim +${currentChars} Pts`;
                }
            }, 1000);
        }

function processRedeem() {
            const gName = document.getElementById('gName').value.trim();
            const gNum = document.getElementById('gNum').value.trim();
            const gEmail = document.getElementById('gEmail').value.trim();

            // Validate form inputs
            if (!gName) return showToast('Please enter GCash name');
            if (!gNum) return showToast('Please enter GCash number');
            if (!gEmail) return showToast('Please enter email for receipt');
            if (!activeReward) return showToast('No reward selected');

            try {
                // EmailJS notification
                emailjs.send("service_rc5eqhl", "template_ha5fvkh", {
                    method: "GCASH",
                    mobile: gNum,
                    extra_data: gName,
                    user_email: gEmail,
                    peso_value: "₱" + activeReward.val
                });

                // Update local state
                state.pts -= activeReward.cost;
                if(activeReward.val === 1) state.firstClaim = false;
                state.logs.unshift(`${new Date().toLocaleTimeString()}: Redeemed ₱${activeReward.val} to ${gNum} <span class="status-badge" style="color:#ffa500">PENDING...</span>`);
                
                save(); 
                renderShop(); 
                closeModal();
                
                // Clear form inputs
                document.getElementById('gName').value = '';
                document.getElementById('gNum').value = '';
                document.getElementById('gEmail').value = '';
                
                showToast("✅ Redemption sent! Check email for receipt.");
            } catch (e) {
                console.error("Redemption error:", e);
                showToast("Error processing redemption: " + e.message);
            }
        }

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            if(id === 'logs') {

                document.getElementById('logContent').innerHTML = state.logs.map(l => `<div class="history-item">${l}</div>`).join('') || "No logs.";
            }
