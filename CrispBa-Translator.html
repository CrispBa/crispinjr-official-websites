    <link rel="apple-touch-icon" href="favicontranslator.ico">
    <meta property="og:title" content="CB | AI Translator" />
    <meta property="og:description" content="A powerful tool for real-time translation, voice recognition, and Image-to-Text (OCR) powered by CrispBa." />
    <meta property="og:image" content="https://crispba.github.io/crispinjr-official-websites/translator.png" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#3b82f6">
    <style>
        /* --- 1. Root & Variable Setup (Matching CrispBa Platform Blue) --- */
        :root {
            --primary: #3b82f6; /* CrispBa Brand Blue */
            --primary-dark: #2563eb;
            --bg: #f4f6f9;
            --card-opaque: #ffffff;
            --card-trans: rgba(255, 255, 255, 0.95); /* Semi-transparent white */
            --textarea-bg: rgba(244, 246, 249, 0.9); /* Semi-transparent light gray */
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
            --shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            --transition: all 0.4s ease;
            --font-family: 'Roboto', sans-serif;
        }

        /* --- 2. Dark Mode Overrides --- */
        :root.dark {
            --bg: #1e1e1e;
            --card-opaque: #2d2d30;
            --card-trans: rgba(45, 45, 48, 0.95); /* Semi-transparent dark gray */
            --textarea-bg: rgba(30, 30, 30, 0.9); /* Semi-transparent dark dark gray */
            --text: #f0f0f0;
            --text-light: #b0b0b0;
            --border: #444444;
            --shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            /* Keep background-color for smooth fade/fallback */
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color var(--transition);
            
            /* Enable positioning context for the pseudo-element */
            position: relative; 
            z-index: 1; /* Ensure content is above the pseudo-element background */
        }

        /* --- NEW: Pseudo-element for Flipped Tech GIF Background --- */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Place it behind the content */
            
            /* The GIF/background properties */
            /* REMINDER: Replace 'https://i.imgur.com/PLACEHOLDER_TECH_GIF.gif' with your actual GIF URL */
            background-image: url('https://i.imgur.com/PLACEHOLDER_TECH_GIF.gif');
            background-repeat: repeat;
            background-size: cover; 
            background-attachment: fixed; 
            
            /* The FLIP/UPSIDE DOWN transform */
            transform: scaleY(-1);
            
            transition: var(--transition); 
        }
        /* ------------------------------------------------------------ */

        /* --- 3. Container and Layout --- */
        .container {
            width: 100%;
            max-width: 900px;
            padding: 0;
            margin-top: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            /* Text shadow added for better contrast over background GIF */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4); 
        }

        header h1 {
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 2.5em;
        }

        /* --- 4. Main Card Styling --- */
        .translator-card {
            /* USE TRANSPARENT CARD VARIABLE */
            background-color: var(--card-trans);
            border-radius: 15px;
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: background-color var(--transition), box-shadow var(--transition), border-color var(--transition);
        }

        /* --- 5. Inputs and Textareas --- */
        .text-area-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text); /* Set to primary text color for better contrast */
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            /* USE SEMI-TRANSPARENT TEXTAREA VARIABLE */
            background-color: var(--textarea-bg);
            color: var(--text);
            resize: none;
            font-size: 1.1em;
            transition: border-color var(--transition), background-color var(--transition);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        /* --- 6. Controls and Buttons --- */
        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        select {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            /* USE SEMI-TRANSPARENT TEXTAREA VARIABLE */
            background-color: var(--textarea-bg);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            box-shadow: 0 6px 8px rgba(59, 130, 246, 0.35);
        }
        
        /* New OCR Button style */
        .btn-secondary {
            background-color: var(--card-opaque);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background-color: var(--bg);
            border-color: var(--primary);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* --- 7. History and Output --- */
        #translationHistory {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            /* USE SEMI-TRANSPARENT TEXTAREA VARIABLE */
            background-color: var(--textarea-bg);
            min-height: 50px;
            max-height: 250px;
            overflow-y: auto;
            color: var(--text-light);
            transition: var(--transition);
        }

        .history-item {
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .original {
            font-weight: bold;
            color: var(--text);
            display: block;
            margin-bottom: 5px;
        }

        .trans {
            color: var(--primary-dark);
            display: block;
            font-style: italic;
        }
        
        /* --- 8. Voice Button Active State --- */
        #voiceBtn {
            background-color: var(--card-opaque);
            color: var(--text);
            border: 1px solid var(--border);
        }

        #voiceBtn.listening {
            background-color: #ef4444; /* Danger Red for Recording */
            color: white;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* --- 9. Toggle Switch --- */
        .toggle-switch-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
            color: var(--text);
            /* Text shadow for better contrast */
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.2); 
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--primary);
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .text-area-group {
                flex-direction: column;
                gap: 15px;
            }
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            .controls > * {
                width: 100%;
            }
            .container {
                margin-top: 10px;
            }
        }
    </style>
</head>

<script>
    // --- 1. Global Variables & Setup ---
    const textToTranslate = document.getElementById('textToTranslate');
    const translatedText = document.getElementById('translatedText');
    const sourceLangSelect = document.getElementById('sourceLangSelect');
    const targetLangSelect = document.getElementById('targetLangSelect');
    const translateBtn = document.getElementById('translateBtn');
    const voiceBtn = document.getElementById('voiceBtn');
    const speakBtn = document.getElementById('speakBtn');
    const ocrBtn = document.getElementById('ocrBtn'); 
    const imageUpload = document.getElementById('imageUpload'); 
    const translationHistory = document.getElementById('translationHistory');
    const darkModeToggle = document.getElementById('darkModeToggle');

    // --- 2. Dark Mode Logic ---
    document.addEventListener('DOMContentLoaded', () => {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'dark' || (savedTheme === null && prefersDark)) {
            document.documentElement.classList.add('dark');
            darkModeToggle.checked = true;
        }

        darkModeToggle.addEventListener('change', () => {
            if (darkModeToggle.checked) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        });
    });

    // --- 3. Live Translation API Function ---
    async function realTranslate(text, sourceLang, targetLang) {
        // Unofficial Google Translate endpoint for client-side functionality
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error(`API error: ${response.statusText}`);
        }

        const data = await response.json();
        
        let translated = "";
        if (data[0] && Array.isArray(data[0])) {
             translated = data[0].map(segment => segment[0]).join('');
        }
        
        if (sourceLang === 'auto' && data[2]) {
            translated += ` (Detected source: ${data[2]})`;
        }
        
        return translated.trim();
    }

    // --- 4. Main Translation Handler ---
    translateBtn.addEventListener('click', async () => {
        const text = textToTranslate.value.trim();
        if (!text) return;

        const sourceLang = sourceLangSelect.value;
        const targetLang = targetLangSelect.value;

        translateBtn.disabled = true;
        translateBtn.textContent = '🤖 Translating...';
        translatedText.value = '...';

        try {
            const translation = await realTranslate(text, sourceLang, targetLang);
            translatedText.value = translation;
            
            // Add to History
            const historyItem = document.createElement('div');
            historyItem.classList.add('history-item');
            
            let displaySource = sourceLang.toUpperCase();
            const match = translation.match(/\(Detected source: ([a-z]{2})\)/);
            if (match) {
                displaySource = match[1].toUpperCase();
            }

            const cleanTranslation = translation.replace(/\s*\(Detected source: [a-z]{2}\)/, '');

            historyItem.innerHTML = `
                <span class="original">${text}</span>
                <span class="trans">${cleanTranslation} (${displaySource} > ${targetLang.toUpperCase()})</span>
            `;

            if (translationHistory.children[0] && translationHistory.children[0].tagName === 'P') {
                translationHistory.removeChild(translationHistory.children[0]); 
            }
            translationHistory.prepend(historyItem);

        } catch (error) {
            translatedText.value = `❌ Connection Error: Could not reach translation service. Check your internet connection or the API.`;
            console.error("Translation API Error:", error);
        } finally {
            translateBtn.disabled = false;
            translateBtn.textContent = '🤖 Translate';
        }
    });

    // --- 5. Text-to-Speech (Speak) Handler ---
    speakBtn.addEventListener('click', () => {
        const textToSpeak = translatedText.value.trim();
        if (!textToSpeak || textToSpeak.includes('Error:') || textToSpeak === '...') return;

        let toSpeak = textToSpeak.replace(/\s*\(Detected source: [a-z]{2}\)/, '');
        
        const utt = new SpeechSynthesisUtterance(toSpeak);
        const code = targetLangSelect.value;
        
        const langMap = {
            'af': 'af-ZA', 'sq': 'sq-AL', 'ar': 'ar-SA', 'hy': 'hy-AM', 'az': 'az-AZ', 'eu': 'eu-ES', 
            'be': 'be-BY', 'bn': 'bn-BD', 'bg': 'bg-BG', 'ca': 'ca-ES', 'zh': 'zh-CN', 'hr': 'hr-HR', 
            'cs': 'cs-CZ', 'da': 'da-DK', 'nl': 'nl-NL', 'en': 'en-US', 'et': 'et-EE', 'tl': 'fil-PH', 
            'fi': 'fi-FI', 'fr': 'fr-FR', 'gl': 'gl-ES', 'ka': 'ka-GE', 'de': 'de-DE', 'el': 'el-GR', 
            'ht': 'ht-HT', 'iw': 'he-IL', 'hi': 'hi-IN', 'hu': 'hu-HU', 'is': 'is-IS', 'id': 'id-ID', 
            'ga': 'ga-IE', 'it': 'it-IT', 'ja': 'ja-JP', 'ko': 'ko-KR', 'lv': 'lv-LV', 'lt': 'lt-LT', 
            'mk': 'mk-MK', 'ms': 'ms-MY', 'mt': 'mt-MT', 'no': 'nb-NO', 'fa': 'fa-IR', 'pl': 'pl-PL', 
            'pt': 'pt-PT', 'ro': 'ro-RO', 'ru': 'ru-RU', 'sr': 'sr-RS', 'sk': 'sk-SK', 'sl': 'sl-SI', 
            'es': 'es-ES', 'sw': 'sw-KE', 'sv': 'sv-SE', 'th': 'th-TH', 'tr': 'tr-TR', 'uk': 'uk-UA', 
            'ur': 'ur-PK', 'vi': 'vi-VN', 'cy': 'cy-GB', 'yi': 'yi-YD', 'zu': 'zu-ZA'
        };
        utt.lang = langMap[code] || 'en-US';

        window.speechSynthesis.speak(utt);
    });

    // --- 6. Voice Input (Speech Recognition) Handler ---
    let listening = false;
    if ('webkitSpeechRecognition' in window) {
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            textToTranslate.value = transcript;
            translateBtn.click(); 
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            if (event.error !== 'no-speech' && event.error !== 'aborted') {
                 translatedText.value = `🎙️ Voice Error: ${event.error}. Try checking your microphone settings.`;
            }
        };

        recognition.onend = () => {
            listening = false;
            voiceBtn.classList.remove('listening');
            voiceBtn.textContent = '🎙️ Talk to Translate';
        };

        voiceBtn.addEventListener('click', () => {
            if (listening) {
                recognition.stop();
            } else {
                let langCode = sourceLangSelect.value === 'auto' ? 'en-US' : sourceLangSelect.value;
                if (langCode.length === 2) {
                    langCode = langCode + '-' + langCode.toUpperCase();
                }
                recognition.lang = langCode;
                
                recognition.start();
                listening = true;
                voiceBtn.classList.add('listening');
                voiceBtn.textContent = '🔴 Recording...';
            }
        });
    } else {
        voiceBtn.disabled = true;
        voiceBtn.textContent = '🎙️ Voice Not Supported';
    }
    
    // --- 7. Image-to-Text (OCR) Handler (NEW FEATURE) ---
    ocrBtn.addEventListener('click', () => {
        imageUpload.click();
    });

    imageUpload.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        imageUpload.value = '';
        
        ocrBtn.disabled = true;
        ocrBtn.textContent = '🖼️ Analyzing Image...';
        textToTranslate.value = 'Analyzing image for text. Please wait...';

        try {
            let langCode = sourceLangSelect.value === 'auto' ? 'eng' : sourceLangSelect.value;
            if (langCode === 'tl') langCode = 'fil'; 
            
            const worker = await Tesseract.createWorker(langCode);
            
            const { data: { text } } = await worker.recognize(file);
            
            textToTranslate.value = text.trim();
            
            await worker.terminate();

            translateBtn.click();
            
        } catch (error) {
            textToTranslate.value = '❌ OCR Error: Could not extract text from the image. ' + error.message;
            console.error('OCR Error:', error);
        } finally {
            ocrBtn.disabled = false;
            setTimeout(() => { ocrBtn.textContent = '🖼️ OCR Image'; }, 500); 
        }
    });

</script>

</body>

</html>
