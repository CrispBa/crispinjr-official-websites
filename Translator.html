<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CrispBa AI Translator - Enhanced</title>
    <style>
        :root {
            --primary: #0078ff;
            --primary-dark: #005fcc;
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease;
        }

        :root.dark {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --text: #e0e0e0;
            --text-light: #b0b0b0;
            --border: #333333;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 6px 16px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #e8ecf1 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
            transition: var(--transition);
        }

        .app {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            max-height: 90vh;
            border-radius: 20px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--card);
            transition: var(--transition);
        }

        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 120, 255, 0.2);
        }

        header h1 {
            font-size: 20px;
            margin: 0;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mode-indicator, .theme-toggle {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .mode-indicator:hover, .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .translator-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .card {
            background: var(--card);
            padding: 16px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label.small {
            font-size: 12px;
            color: var(--text-light);
            font-weight: 500;
        }

        select, textarea, input {
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-family: inherit;
            transition: var(--transition);
            width: 100%;
            box-sizing: border-box;
        }

        select:focus, textarea:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 120, 255, 0.1);
        }

        .control-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            font-size: 14px;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
            box-shadow: var(--shadow-hover);
        }

        .translation-history {
            max-height: 30vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        :root.dark .translation-history {
            background: #252525;
        }

        .orig {
            align-self: flex-end;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 90%;
            animation: fadeIn 0.4s ease-out;
        }

        .trans {
            align-self: flex-start;
            background: rgba(0, 120, 255, 0.1);
            border: 1px solid rgba(0, 120, 255, 0.2);
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 90%;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
            transition: var(--transition);
        }

        :root.dark .footer-note {
            background: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .app {
                height: 95vh;
                border-radius: 16px;
            }
            .translator-container {
                padding: 16px;
            }
            .btn-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="app" role="application" aria-label="CrispBa AI Translator">
        <header>
            <h1>CrispBa AI Translator</h1>
            <div class="header-controls">
                <button class="mode-indicator" id="modeIndicator">Translate mode active</button>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </header>
        <div class="translator-container">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <strong>Quick Translate</strong>
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 14px;">
                        <input type="checkbox" id="autoDetect" checked>
                        <span>Auto-detect</span>
                    </label>
                </div>
                <div class="controls">
                    <div class="control-row">
                        <label class="small">From:</label>
                        <select id="sourceLang">
                            <option value="auto">Auto</option>
                            <option value="en">English</option>
                            <option value="tl">Tagalog</option>
                            <option value="ceb">Cebuano</option>
                            <option value="id">Indonesian</option>
                            <option value="es">Spanish</option>
                        </select>
                    </div>
                    <div class="control-row">
                        <label class="small">To:</label>
                        <select id="targetLang">
                            <option value="en">English</option>
                            <option value="tl">Tagalog (Filipino)</option>
                            <option value="ceb">Cebuano (Bisaya)</option>
                            <option value="id">Indonesian (Bahasa)</option>
                            <option value="es">Spanish</option>
                            <option value="fr">French</option>
                            <option value="ja">Japanese</option>
                            <option value="ko">Korean</option>
                            <option value="zh">Chinese</option>
                            <option value="de">German</option>
                            <option value="it">Italian</option>
                            <option value="ar">Arabic</option>
                        </select>
                    </div>
                </div>
                <textarea id="textToTranslate" rows="4" placeholder="Type text to translate..."></textarea>
                <div class="btn-group">
                    <button class="btn" id="voiceBtn">🎤 Voice</button>
                    <button class="btn" id="translateBtn">Translate</button>
                    <button class="btn" id="speakBtn">🔊 Speak</button>
                    <button class="btn" id="sendToChatBtn">Send to Chat</button>
                </div>
                <div class="translation-history" id="translationHistory" aria-live="polite">
                    <!-- Translations appear here -->
                </div>
                <div class="footer-note">Offline mode uses a built-in dictionary (English ↔ Tagalog/Cebuano/Indonesian + basic Spanish). For online mode (better quality), set window.OPENAI_API_KEY.</div>
            </div>
        </div>
    </div>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        let isDark = localStorage.getItem('translate-theme') === 'dark';
        function setTheme(dark) {
            document.documentElement.classList.toggle('dark', dark);
            localStorage.setItem('translate-theme', dark ? 'dark' : 'light');
            themeToggle.textContent = dark ? '☀️' : '🌙';
        }
        if (isDark) setTheme(true);
        themeToggle.addEventListener('click', () => { isDark = !isDark; setTheme(isDark); });

        // Translator Scripts (unchanged from previous)
        const voiceBtn = document.getElementById('voiceBtn');
        const translateBtn = document.getElementById('translateBtn');
        const speakBtn = document.getElementById('speakBtn');
        const sendToChatBtn = document.getElementById('sendToChatBtn');
        const textToTranslate = document.getElementById('textToTranslate');
        const targetLangSelect = document.getElementById('targetLang');
        const sourceLangSelect = document.getElementById('sourceLang');
        const autoDetect = document.getElementById('autoDetect');
        const translationHistory = document.getElementById('translationHistory');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
        }
        window.OPENAI_API_KEY = window.OPENAI_API_KEY || null;

        const offlineDict = {
            'hello': 'kamusta|kumusta|hola|bonjour|konnichiwa|annyeong|ni hao|hallo|ciao|marhaba',
            'thank you': 'salamat|salamat|terima kasih|gracias|merci|arigato|gamsahabnida|xie xie|danke|graz ie|shukran',
            'good morning': 'magandang umaga|maayong buntag|selamat pagi|buenos dias|bonjour|ohayou|heun achim|zao shang hao|guten morgen|buongiorno|sabah alkhair',
            'i love you': 'mahal kita|gi higugma tika|aku cinta kamu|te amo|je t aime|aishiteru|saranghae|wo ai ni|ich liebe dich|ti amo|habibuk',
            'how are you': 'kamusta ka|kumusta ka|apa kabar|como estas|comment ca va|genki desu ka|eottae|ni hao ma|wie gehts|come stai|kayfa haluk',
            'goodbye': 'paalam|babay|selamat tinggal|adios|au revoir|sayonara|annyeong|zaijian|tschuess|ciao|ma a salama',
            'yes': 'oo|oo|ya|sí|oui|hai|ne|shí|nǎi|ja|naam',
            'no': 'hindi|dili|tidak|no|non|いいえ|ani|bu|nein|no|la',
            'friend': 'kaibigan|higala|teman|amigo|ami|tomodachi|ching u|pengyou|freund|amico|sadiq',
            'please': 'pakiusap|palihug|tolong|por favor|sil vous plait|kudasai|jebal|qing|bitte|per favore|min fadlak',
            'where': 'saan|asa|di mana|donde|ou|doko|eodi|na li|wo|dove|ayn',
            'who': 'sino|kini|siapa|quien|qui|dare|nu gu|shei|wer|chi|man',
            'food': 'pagkain|kan-on|makanan|comida|nourriture|tabemono|eumsik|shiwu|essen|cibo|taam',
            'single': 'single|single|single|soltero|celibataire|doko?|single|dan?|single|single|single'
        };

        const dictOrder = ['tl', 'ceb', 'id', 'es', 'fr', 'ja', 'ko', 'zh', 'de', 'it', 'ar'];

        function offlineTranslate(text, from, to) {
            const s = text.toLowerCase().trim();
            try {
                const phrases = Object.keys(offlineDict).sort((a, b) => b.length - a.length);
                for (const p of phrases) {
                    if (s.includes(p)) {
                        const pipes = offlineDict[p].split('|');
                        const idx = dictOrder.indexOf(to);
                        if (idx >= 0) return capitalizeLike(text, pipes[idx]);
                    }
                }
                const words = s.split(/\s+/);
                const out = words.map(w => {
                    for (const p of phrases) {
                        if (p === w) {
                            const pipes = offlineDict[p].split('|');
                            const idx = dictOrder.indexOf(to);
                            if (idx >= 0) return pipes[idx];
                        }
                    }
                    return w;
                });
                return capitalizeLike(text, out.join(' '));
            } catch (e) {
                return text;
            }
        }

        function capitalizeLike(orig, translated) {
            if (!orig) return translated;
            if (orig[0] === orig[0].toUpperCase()) return translated.charAt(0).toUpperCase() + translated.slice(1);
            return translated;
        }

        function detectLanguage(text) {
            const t = text.toLowerCase();
            const tagalogHints = ['salamat', 'maganda', 'ka', 'po', 'opo', 'kain', 'kamusta', 'ako', 'siya'];
            const cebHints = ['maayong', 'gihigugma', 'higala', 'babay', 'unsa', 'asa'];
            const idHints = ['terima', 'selamat', 'apa kabar', 'kamu', 'kita'];
            const esHints = ['hola', 'gracias', 'buenos', 'por favor', 'amigo'];
            const jaHints = ['konnichiwa', 'arigato', 'sayonara', 'hai', 'iie'];
            const koHints = ['annyeong', 'gamsahabnida', 'saranghae', 'ne', 'ani'];
            const zhHints = ['ni hao', 'xie xie', 'zaijian', 'shi', 'bu'];
            let scores = { en: 0, tl: 0, ceb: 0, id: 0, es: 0, ja: 0, ko: 0, zh: 0 };
            for (const w of tagalogHints) if (t.includes(w)) scores.tl++;
            for (const w of cebHints) if (t.includes(w)) scores.ceb++;
            for (const w of idHints) if (t.includes(w)) scores.id++;
            for (const w of esHints) if (t.includes(w)) scores.es++;
            for (const w of jaHints) if (t.includes(w)) scores.ja++;
            for (const w of koHints) if (t.includes(w)) scores.ko++;
            for (const w of zhHints) if (t.includes(w)) scores.zh++;
            let max = 'en', maxv = 0;
            for (const k in scores) {
                if (scores[k] > maxv) { max = k; maxv = scores[k]; }
            }
            return maxv > 0 ? max : 'en';
        }

        translateBtn.addEventListener('click', () => {
            const text = textToTranslate.value.trim();
            if (!text) return;
            const src = autoDetect.checked ? (sourceLangSelect.value === 'auto' ? detectLanguage(text) : sourceLangSelect.value) : sourceLangSelect.value;
            const target = targetLangSelect.value;
            const translated = offlineTranslate(text, src, target);
            const origNode = document.createElement('div');
            origNode.className = 'orig';
            origNode.textContent = text + ' (' + src + ')';
            const transNode = document.createElement('div');
            transNode.className = 'trans';
            transNode.textContent = translated + ' (' + target + ')';
            translationHistory.prepend(transNode);
            translationHistory.prepend(origNode);
            textToTranslate.value = '';
            translationHistory.scrollTop = 0;
        });

        sendToChatBtn.addEventListener('click', () => {
            const firstTranslated = translationHistory.querySelector('.trans');
            const message = firstTranslated ? firstTranslated.textContent.replace(/\s*\([^)]+\)$/, '') : '';
            if (!message) return;
            // Open chat in new tab if separate file exists
            window.open('chat.html', '_blank');
            // Optionally, you could post the message via localStorage or event, but kept simple
        });

        let listening = false;
        if (!recognition) {
            voiceBtn.disabled = true;
            voiceBtn.textContent = 'Not supported';
        } else {
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.onresult = (e) => {
                const spoken = e.results[0][0].transcript;
                textToTranslate.value = spoken;
            };
            recognition.onend = () => {
                listening = false;
                voiceBtn.textContent = '🎤 Voice';
            };
            voiceBtn.addEventListener('click', () => {
                if (listening) {
                    recognition.stop();
                    listening = false;
                    voiceBtn.textContent = '🎤 Voice';
                } else {
                    recognition.start();
                    listening = true;
                    voiceBtn.textContent = 'Listening...';
                }
            });
        }

        speakBtn.addEventListener('click', () => {
            const firstTranslated = translationHistory.querySelector('.trans');
            let toSpeak = firstTranslated ? firstTranslated.textContent.replace(/\s*\([^)]+\)$/, '') : textToTranslate.value;
            if (!toSpeak) return;
            toSpeak = toSpeak.replace(/\s*\([^)]+\)/g, '');
            const utt = new SpeechSynthesisUtterance(toSpeak);
            const code = targetLangSelect.value;
            const langMap = {
                'en': 'en-US', 'tl': 'fil-PH', 'ceb': 'en-US', 'id': 'id-ID', 'es': 'es-ES',
                'fr': 'fr-FR', 'ja': 'ja-JP', 'ko': 'ko-KR', 'zh': 'zh-CN', 'de': 'de-DE',
                'it': 'it-IT', 'ar': 'ar-SA'
            };
            utt.lang = langMap[code] || 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utt);
        });
    </script>
</body>
</html>
